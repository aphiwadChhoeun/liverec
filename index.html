<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="LiveRec — real-time webcam face &amp; pose recognition with an extensible augmentation-module pipeline." />
  <title>LiveRec · Face &amp; Pose Studio</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1>Live<span class="accent">Rec</span></h1>
        <p class="tagline">Webcam face &amp; pose studio — wireframe overlays + pluggable augmentation modules</p>
      </div>
      <div class="stats">
        <span id="fps-badge" class="badge" title="Rendered frames per second">— fps</span>
        <span id="detect-badge" class="badge" title="Detections completed per second">detect —</span>
      </div>
    </header>

    <main class="layout">
      <section class="stage-card" aria-label="Camera preview">
        <div class="stage">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div class="stage-msg" id="stage-msg">
            <p id="stage-msg-text">Press <strong>Start camera</strong> to begin.</p>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="Controls">
        <fieldset>
          <legend>Camera</legend>
          <div class="row">
            <button id="btn-start" class="btn primary" type="button" aria-pressed="false">Start camera</button>
            <button id="btn-snapshot" class="btn" type="button" disabled>Save snapshot</button>
          </div>
          <label class="field">
            <span>Camera device</span>
            <select id="camera-select">
              <option value="">Default camera</option>
            </select>
          </label>
          <label class="check">
            <input type="checkbox" id="mirror-toggle" checked />
            <span>Mirror (selfie view)</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>Wireframe layers</legend>
          <label class="check">
            <input type="checkbox" id="layer-faceMesh" checked />
            <span>Face mesh (tessellation)</span>
          </label>
          <label class="check">
            <input type="checkbox" id="layer-faceContours" checked />
            <span>Face contours</span>
          </label>
          <label class="check">
            <input type="checkbox" id="layer-pose" checked />
            <span>Pose skeleton</span>
          </label>
          <label class="check">
            <input type="checkbox" id="layer-hands" checked />
            <span>Hand landmarks</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>Augmentation modules</legend>
          <div id="modules-list" class="modules"></div>
        </fieldset>

        <fieldset>
          <legend>Status</legend>
          <p id="status-line" class="status" role="status" aria-live="polite">Idle — press Start camera.</p>
          <p id="error-line" class="error" role="alert" hidden></p>
        </fieldset>
      </aside>
    </main>

    <footer class="app-footer">
      <p>Everything runs on-device · models &amp; WASM are fetched from CDN on first load</p>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
